server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: transport-ticket-app
  
  # Configuration de la base de données MySQL
  datasource:
    url: jdbc:mysql://localhost:3306/transport_tickets?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: transport_user
    password: transport_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # Configuration JPA/Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  
  # Configuration de l'email
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:your-email@gmail.com}
    password: ${EMAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Configuration JWT
jwt:
  secret: ${JWT_SECRET:mySecretKey123456789012345678901234567890}
  expiration: 86400000 # 24 heures en millisecondes

# Configuration Stripe
stripe:
  api-key: ${STRIPE_API_KEY:sk_test_your_stripe_secret_key}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_your_webhook_secret}

# Configuration des logs
logging:
  level:
    com.transport.ticketapp: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Configuration Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Configuration Swagger/OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method